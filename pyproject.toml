[project]
name = "rag-own-publications"
version = "0.1.0"
description = "Upload GEG publications to the RAG bucket under DOI-based names, skipping duplicates."
authors = [{name = "ETHZ/EAPS/GEG Group"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-storage>=3.17.1",
    "httpx>=0.28.1",
    "pymupdf>=2.0",
    "python-slugify>=9.1.3",
    "tabulate>=0.10.0",
]


[dependency-groups]   # e.g. uv add --group dev ruff
dev = [
    "mypy~=1.19",  # static type checker
    "pytest~=9.0",  # testing
    "ruff~=0.15",  # linter and formatter
    "pylsp-mypy~=0.7",  # provides connection from python LSP to mypy
    "pylsp-rope~=0.1",  # provides linting tools
    "prek>=0.3.13",  # git hook management
    "pytest-cov>=7.1.0",
]

[project.scripts]
geg-rag-upload = "rag_own_publications.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ARG",  # flake8-unused-arguments
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "D400",
    "D415",
    "D205",
]

[tool.ruff.lint.isort]
known-first-party = ["rag_own_publications"]

[tool.ruff.lint.per-file-ignores]   # otherwise ruff shows "imported but unused" error
"__init__.py" = ["F401"]
"tests/**" = ["D"]                  # no docstring rules inside tests/ folder

[tool.ruff.lint.pydocstyle]   # defines the doc string format
convention = "google"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
# Enables strict mypy checks; comment this out for projects that do not require strict type checking.
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=rag_own_publications --cov-report=term-missing --cov-fail-under=80"

[[tool.mypy.overrides]]
module = ["google.cloud.*", "tabulate", "vertexai", "vertexai.*", "functions_framework", "cloudevents.*"]
ignore_missing_imports = true

# PyMuPDF ships only partial type hints; its Document/Page calls are untyped.
[[tool.mypy.overrides]]
module = ["rag_own_publications.pdfmeta", "tests.test_pdfmeta", "tests.test_cli"]
disallow_untyped_calls = false

# function/main.py is deployed as-is to Cloud Functions; functions_framework's decorator is untyped.
[[tool.mypy.overrides]]
module = ["main"]
disallow_untyped_decorators = false
warn_return_any = false
